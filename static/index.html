<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ticket Triage Agents</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #111; color: #eee; }
  textarea { width: 100%; height: 100px; padding: 10px; font-size: 1rem; }
  button { margin-top: 10px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  .card { margin-top: 20px; padding: 15px; border: 1px solid #444; border-radius: 6px; background: #1a1a1a; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Ticket Triage Agents</h1>
  <textarea id="ticketText" placeholder="Paste a raw ticket here..."></textarea><br>
  <button onclick="submitTicket()">Triage</button>
  <div id="results"></div>

<script>
async function submitTicket() {
  const text = document.getElementById('ticketText').value;
  document.getElementById('results').innerHTML = 'Processing...';
  const res = await fetch('/triage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  const data = await res.json();
  document.getElementById('results').innerHTML =
    '<div class="card"><pre>' + JSON.stringify(data, null, 2) + '</pre></div>';
}
</script>
</body>
</html>
