<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ticket Triage Agents</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #111; color: #eee; }
  textarea { width: 100%; height: 100px; padding: 10px; font-size: 1rem; }
  button { margin-top: 10px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  .card { margin-top: 20px; padding: 15px; border: 1px solid #444; border-radius: 6px; background: #1a1a1a; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Ticket Triage Agents</h1>
  <textarea id="ticketText" placeholder="Paste a raw ticket here..."></textarea><br>
  <button onclick="submitTicket()">Triage</button>
  <div id="results"></div>

<script>
async function submitTicket() {
  const text = document.getElementById('ticketText').value;
  document.getElementById('results').innerHTML = 'Processing...';
  const res = await fetch('/triage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  const data = await res.json();
  const t = data.triage;
  const a = data.audit;
  const r = data.routing;

  let html = `
    <div class="card">
      <h3>${t.priority} — ${t.category}</h3>
      <p><em>${t.priority_reasoning}</em></p>
      <p>SLA: respond in ${t.sla_response_minutes} min, resolve in ${t.sla_resolve_hours} hr</p>
      <p><strong>Drafted reply:</strong> ${t.drafted_reply}</p>
    </div>
    <div class="card">
      <h3>${a.approved ? '✅ Approved' : '❌ Rejected'}</h3>
      <ul>${a.reasons.map(x => '<li>' + x + '</li>').join('')}</ul>
      ${data.retried ? '<p><em>Retried after initial rejection.</em></p>' : ''}
      ${data.flagged ? '<p><strong>⚠ Flagged for human review.</strong></p>' : ''}
    </div>
  `;

  if (r) {
    html += `
      <div class="card">
        <h3>Routed</h3>
        <p>Team: <strong>${r.team}</strong></p>
        <p>Assigned to: <strong>${r.assigned}</strong></p>
        <p>Sent to: <strong>${r.channel === 'slack' ? '📣 Slack alert sent' : 'No notification'}</strong></p>
      </div>
    `;
  }

  document.getElementById('results').innerHTML = html;
}
</script>
</body>
</html>
